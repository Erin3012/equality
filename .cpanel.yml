# Tarea de despliegue para cPanel (Git Version Control → "Deploy HEAD Commit").
# Copia el sitio estático a la carpeta document root del subdominio.
# Subdominio: equalityconsultores.qlc.cl (carpeta ~/public_html/equalityconsultores).
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/equalityconsultores
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH/
    - /bin/cp -R assets $DEPLOYPATH/
